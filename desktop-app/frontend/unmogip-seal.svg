<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#1a8fbf" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#1a8fbf" stroke-width="1.5"/>
  
  <!-- Globe lines -->
  <ellipse cx="100" cy="100" rx="60" ry="60" fill="none" stroke="#1a8fbf" stroke-width="1.2" opacity="0.5"/>
  <ellipse cx="100" cy="100" rx="35" ry="60" fill="none" stroke="#1a8fbf" stroke-width="1" opacity="0.5"/>
  <line x1="40" y1="100" x2="160" y2="100" stroke="#1a8fbf" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="40" x2="100" y2="160" stroke="#1a8fbf" stroke-width="1" opacity="0.5"/>
  
  <!-- Book icon in center -->
  <g transform="translate(100,100)">
    <!-- Open book -->
    <path d="M-25,-15 C-25,-20 -15,-22 0,-20 C15,-22 25,-20 25,-15 L25,15 C25,18 15,20 0,18 C-15,20 -25,18 -25,15 Z" 
          fill="white" stroke="#1a8fbf" stroke-width="1.5"/>
    <!-- Book spine -->
    <line x1="0" y1="-20" x2="0" y2="18" stroke="#1a8fbf" stroke-width="1.5"/>
    <!-- Book pages left -->
    <line x1="-18" y1="-14" x2="-5" y2="-12" stroke="#1a8fbf" stroke-width="0.8" opacity="0.6"/>
    <line x1="-18" y1="-8" x2="-5" y2="-6" stroke="#1a8fbf" stroke-width="0.8" opacity="0.6"/>
    <line x1="-18" y1="-2" x2="-5" y2="0" stroke="#1a8fbf" stroke-width="0.8" opacity="0.6"/>
    <line x1="-18" y1="4" x2="-5" y2="6" stroke="#1a8fbf" stroke-width="0.8" opacity="0.6"/>
    <!-- Book pages right -->
    <line x1="5" y1="-12" x2="18" y2="-14" stroke="#1a8fbf" stroke-width="0.8" opacity="0.6"/>
    <line x1="5" y1="-6" x2="18" y2="-8" stroke="#1a8fbf" stroke-width="0.8" opacity="0.6"/>
    <line x1="5" y1="0" x2="18" y2="-2" stroke="#1a8fbf" stroke-width="0.8" opacity="0.6"/>
    <line x1="5" y1="6" x2="18" y2="4" stroke="#1a8fbf" stroke-width="0.8" opacity="0.6"/>
    <!-- laurel wreath left -->
    <path d="M-30,15 C-35,5 -38,-8 -32,-20" fill="none" stroke="#1a8fbf" stroke-width="1.5"/>
    <path d="M-28,12 C-32,4 -34,-6 -30,-16" fill="none" stroke="#1a8fbf" stroke-width="1"/>
    <!-- laurel wreath right -->
    <path d="M30,15 C35,5 38,-8 32,-20" fill="none" stroke="#1a8fbf" stroke-width="1.5"/>
    <path d="M28,12 C32,4 34,-6 30,-16" fill="none" stroke="#1a8fbf" stroke-width="1"/>
  </g>
  
  <!-- Circular text - top -->
  <defs>
    <path id="topArc" d="M 30,100 a 70,70 0 0,1 140,0"/>
    <path id="bottomArc" d="M 170,100 a 70,70 0 0,1 -140,0"/>
  </defs>
  <text font-size="11" fill="#1a8fbf" font-weight="600" font-family="Arial, sans-serif" letter-spacing="3">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">UNITED NATIONS</textPath>
  </text>
  <text font-size="11" fill="#1a8fbf" font-weight="600" font-family="Arial, sans-serif" letter-spacing="3">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">MILITARY OBSERVER GROUP</textPath>
  </text>
  
  <!-- Stars -->
  <circle cx="30" cy="100" r="2.5" fill="#1a8fbf"/>
  <circle cx="170" cy="100" r="2.5" fill="#1a8fbf"/>
</svg>
